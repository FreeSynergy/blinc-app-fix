[package]
edition = "2024"
rust-version = "1.89"
name = "blinc_app"
version = "0.6.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Blinc application framework with clean layout and rendering API"
documentation = "https://docs.rs/blinc_app"
readme = "README.md"
license = "Apache-2.0"
repository = "https://github.com/project-blinc/Blinc"
resolver = "2"

[features]
android = [
    "blinc_platform_android",
    "android-activity",
    "ndk",
    "jni",
    "android_logger",
    "log",
    "tracing-android",
    "tracing-subscriber",
    "blinc_gpu/android",
    "blinc_gpu/bc-encode",
]
default = ["windowed"]
dialogs = ["rfd"]
fuchsia = []
harmony = [
    "blinc_gpu/harmony",
    "blinc_gpu/bc-encode",
]
hot-reload = [
    "subsecond",
    "tungstenite",
    "dioxus-cli-config",
    "notify",
]
hotkeys = ["global-hotkey"]
ios = [
    "blinc_platform_ios",
    "blinc_gpu/ios",
    "blinc_gpu/bc-encode",
]
notifications = ["notify-rust"]
tray = [
    "tray-icon",
    "muda",
]
wayland-frame-gate = [
    "wayland-client",
    "wayland-backend",
]
web = [
    "blinc_platform_web",
    "blinc_noto_emoji",
    "blinc_noto_symbols",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "console_error_panic_hook",
    "blinc_gpu/web",
]
windowed = [
    "winit",
    "blinc_platform_desktop",
    "blinc_gpu/desktop",
    "blinc_gpu/bc-encode",
]
windowed-full = [
    "windowed",
    "dialogs",
    "tray",
    "notifications",
    "hotkeys",
]

[lib]
name = "blinc_app"
crate-type = [
    "rlib",
    "staticlib",
]
path = "src/lib.rs"

[[test]]
name = "component_props"
path = "tests/component_props.rs"

[[test]]
name = "rich_text_wrap_with_fonts"
path = "tests/rich_text_wrap_with_fonts.rs"

